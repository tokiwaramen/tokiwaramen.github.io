  <!-- Hamburger (Mobile only) -->
  <span class="text-2xl cursor-pointer m-4 md:hidden z-60">
    <ion-icon name="menu-outline" onclick="toggleMobileMenu(this)"></ion-icon>
  </span>
</div>

<script>
  function toggleMobileMenu() {
    const menu = document.getElementById('menu-list');
    const isHidden = menu.classList.contains('opacity-0');
    if (isHidden) {
      menu.classList.remove('opacity-0');
      menu.classList.remove('hidden');
    } else {
      menu.classList.add('opacity-0');
      setTimeout(() => menu.classList.add('hidden'), 300);
    }
  }

  function toggleLangDropdown(event) {
    event.stopPropagation();
    const langList = document.getElementById('lang-options');
    const chevron = document.getElementById('lang-chevron');
    langList.classList.toggle('hidden');
    if (chevron) chevron.classList.toggle('rotate-180');
  }

  document.addEventListener('click', function (event) {
    const langDropdown = document.getElementById('lang-options');
    const langButton = event.target.closest('#language-button');
    const isInsideDropdown = langDropdown && langDropdown.contains(event.target);
    if (!isInsideDropdown && !langButton && window.innerWidth >= 768) {
      langDropdown?.classList.add('hidden');
      document.getElementById('lang-chevron')?.classList.remove('rotate-180');
    }
  });
</script>
