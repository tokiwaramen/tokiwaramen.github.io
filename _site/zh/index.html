<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>主页 - Tokiwa Ramen</title>
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/assets/main.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body class="has-image">
  <!-- NAVIGATION -->
<div class="flex justify-between items-center p-4">
  <!-- Desktop Nav & Mobile Menu -->
  <nav class="w-full">
    <ul id="menu-list" class="hidden md:flex md:justify-end md:static md:bg-transparent md:p-0 flex-col absolute top-0 left-0 w-full bg-zinc-900 text-white p-8 md:flex-row md:min-h-0 min-h-screen z-50 transition-opacity duration-300 opacity-0 md:opacity-100">

      <!-- Close Button (Mobile only) -->
      <li class="flex justify-end md:hidden">
        <button onclick="toggleMobileMenu()" class="text-3xl mb-6">
          <ion-icon name="close-outline"></ion-icon>
        </button>
      </li>

      <!-- Main Menu Items -->
      
      

      <li class="mx-4 my-6"><a href="/zh/" class="uppercase hover:text-[rgb(162,131,78)]">主页</a></li>
      <li class="mx-4 my-6"><a href="/zh/menu/" class="uppercase hover:text-[rgb(162,131,78)]">菜单</a></li>
      <li class="mx-4 my-6"><a href="/zh/faq/" class="uppercase hover:text-[rgb(162,131,78)]">常见问题</a></li>
      <li class="mx-4 my-6"><a href="/zh/contact/" class="uppercase hover:text-[rgb(162,131,78)]">联系我们</a></li>


      <!-- Language Switcher -->
      <li class="mx-4 my-6 w-full md:w-auto relative">
        <button id="language-button" onclick="toggleLangDropdown(event)" class="uppercase flex items-center w-full md:w-auto hover:text-[rgb(162,131,78)]">
          <ion-icon name="globe-outline" class="text-xl mr-2 transition-colors duration-300"></ion-icon>
          <span class="md:hidden">
            语言
          </span>
          <ion-icon id="lang-chevron" name="chevron-down-outline" class="ml-auto md:hidden transition-transform duration-300"></ion-icon>
        </button>
        <ul id="lang-options" class="hidden md:absolute right-0 bg-zinc-900 text-white md:shadow-lg md:rounded-lg md:mt-2 md:text-left w-full md:w-auto">
          
          

          
            
          

          
          

          <li class="mt-2">
            <a href="/" 
              class="block px-2 py-1 hover:text-[rgb(162,131,78)] transition-colors duration-200 ">
                English
            </a>
          </li>
        
            
          

          
          

          <li class="">
            <a href="/zh/" 
              class="block px-2 py-1 hover:text-[rgb(162,131,78)] transition-colors duration-200 font-bold">
                中文
            </a>
          </li>
        
            
          

          
          

          <li class="">
            <a href="/ja/" 
              class="block px-2 py-1 hover:text-[rgb(162,131,78)] transition-colors duration-200 ">
                日本語
            </a>
          </li>
        
            
          

          
          

          <li class="">
            <a href="/ko/" 
              class="block px-2 py-1 hover:text-[rgb(162,131,78)] transition-colors duration-200 ">
                한국어
            </a>
          </li>
        
            
          

          
          

          <li class="">
            <a href="/fr/" 
              class="block px-2 py-1 hover:text-[rgb(162,131,78)] transition-colors duration-200 ">
                Français
            </a>
          </li>
        
      </ul>
  </nav>

  <!-- Hamburger (Mobile only) -->
  <span class="text-2xl cursor-pointer m-4 md:hidden z-60">
    <ion-icon name="menu-outline" onclick="toggleMobileMenu(this)"></ion-icon>
  </span>
</div>

<script>
  function toggleMobileMenu() {
    const menu = document.getElementById('menu-list');
    const isHidden = menu.classList.contains('opacity-0');
    if (isHidden) {
      menu.classList.remove('opacity-0');
      menu.classList.remove('hidden');
    } else {
      menu.classList.add('opacity-0');
      setTimeout(() => menu.classList.add('hidden'), 300);
    }
  }

  function toggleLangDropdown(event) {
    event.stopPropagation();
    const langList = document.getElementById('lang-options');
    const chevron = document.getElementById('lang-chevron');
    langList.classList.toggle('hidden');
    if (chevron) chevron.classList.toggle('rotate-180');
  }

  document.addEventListener('click', function (event) {
    const langDropdown = document.getElementById('lang-options');
    const langButton = event.target.closest('#language-button');
    const isInsideDropdown = langDropdown && langDropdown.contains(event.target);
    if (!isInsideDropdown && !langButton && window.innerWidth >= 768) {
      langDropdown?.classList.add('hidden');
      document.getElementById('lang-chevron')?.classList.remove('rotate-180');
    }
  });
</script>


  <main>
    <div class="overlay"></div>
<div class="md:container lg:container mx-auto px-4">
  <div class="flex justify-center m-6 py-4">

  <div class="spacer"></div>
  <h2 class="text-align-center md:text-lg lg:text-xl">
    <b>11978 - 104 Ave<br />Edmonton, AB, T5K 0G6</b>
  </h2>
  <div class="spacer"></div>
  <p class="text-align-center mb-6 md:text-lg lg:text-xl" style="font-size: 20px">
    埃德蒙顿 Brewery District
  </p>

  <div class="flex item-center justify-center m-6">
    <a href="https://maps.app.goo.gl/b67m8MTwT8tmNGto8?g_st=ic">
      <img class="h-6 mx-4" src="/assets/images/google.png" alt="Google 地图" />
    </a>
    <a href="https://maps.apple.com/?address=11978%20104th%20Ave%20Nw,%20Edmonton%20AB%20T5K%200G6,%20Canada&amp;auid=9588563690901774416&amp;ll=53.547454,-113.527790&amp;lsp=9902&amp;q=Tokiwa%20Ramen">
      <img class="h-6" src="/assets/images/apple.png" alt="Apple 地图" />
    </a>
  </div>

  <p class="text-align-center mt-10" style="font-size: 15px">
    * 最后点单时间为下午 2:45，或售罄为止。
  </p>
</div>

  </main>

  <footer class="text-center p-10 text-sm text-gray-400">© 2025 Tokiwa Ramen</footer>
</body>
</html>
